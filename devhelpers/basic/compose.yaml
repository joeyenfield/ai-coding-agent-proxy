# The quickstart built from this checkout, to try changes: from devhelpers/basic,
#   podman compose up -d --build
# The same stack as deploy/compose/quickstart (server, issuer, PostgreSQL, two machines, Ollama) and its
# README; server/tests/test_quickstart.py keeps the two in step. Only this one has test data: Company A
# (compa.admin, compa.user) and Company B (compb.admin, compb.user), who sign in with testdata (TESTDATA_PASSWORD).
# Its GPU file works here too:
#   podman compose -f compose.yaml -f ../../deploy/compose/quickstart/compose.gpu.yaml up -d --build
#
# Every image builds from this checkout (no published ones), under local names that devhelpers/basic,
# peer and allinone share. `up -d --build` rebuilds after a change; their version says <VERSION>+unknown,
# as the build has no git. Its own project name keeps its volumes apart from the deploy stack's; both
# use the same host ports, so run one at a time.
name: ai-control-mesh-dev

x-auth: &auth
  AI_PROXY_OIDC_ISSUER: http://localhost:20000
  AI_PROXY_OIDC_AUDIENCE: http://localhost:19999
  AI_PROXY_OIDC_REDIRECT_URIS: http://localhost:19999/api/auth/callback
  AI_PROXY_OIDC_BROWSER_ORIGINS: http://localhost:19999
  AI_PROXY_OIDC_INTROSPECTION_SECRET: quickstart-local-introspection-secret
  AI_PROXY_USERNAME: admin
  AI_PROXY_PASSWORD: ${QUICKSTART_ADMIN_PASSWORD:-secret}

x-machine: &machine
  image: localhost/ai-control-mesh-dev-machine
  build:
    context: ../..
    dockerfile: sandbox/Dockerfile
  restart: unless-stopped
  entrypoint: [tini, --, python3, /quickstart/start.py, machine]
  # Stated here as well as in the image: Podman ignores a HEALTHCHECK in an OCI image.
  healthcheck:
    test: [CMD-SHELL, 'agent-machine | grep -q "^Fleet *: connected"']
    interval: 30s
    timeout: 5s
    start_period: 30s
  environment: &machine-env
    QUICKSTART_PASSWORD: ${QUICKSTART_ADMIN_PASSWORD:-secret}
    AI_PROXY_URL: http://localhost:19999
    PYTHONDONTWRITEBYTECODE: "1"
  depends_on:
    server:
      condition: service_healthy
    auth:
      condition: service_healthy

services:
  # Everything the server and agent-auth keep, each in its own schema and role.
  postgres:
    image: docker.io/library/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: mesh
      POSTGRES_PASSWORD: quickstart-postgres
      AI_PROXY_DB_API_PASSWORD: quickstartapi
      AI_PROXY_DB_AUTH_PASSWORD: quickstartauth
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../server/docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-mesh.sh:ro,z
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -d, mesh]
      interval: 5s
      timeout: 4s
      retries: 20

  server:
    image: localhost/ai-control-mesh-dev-server
    build:
      context: ../..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    entrypoint: [python, /quickstart/start.py, server]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *auth
      AI_PROXY_URL: http://localhost:19999
      # Local providers are adopted from the fleet: machine-1's Ollama.
      AI_PROXY_DEFAULT_BACKEND: machine-1
      AI_PROXY_DATABASE_URL: postgresql+psycopg://mesh_api:quickstartapi@postgres:5432/mesh
      # Optional operator key; otherwise start.py provisions one in the persistent server-logs volume.
      AI_PROXY_VAULT_KEYS: ${AI_PROXY_VAULT_KEYS:-}
      # Development only (not in the deploy quickstart): two organizations with two people each, made on
      # every start if missing. They sign in with TESTDATA_PASSWORD (default testdata).
      QUICKSTART_ORGS: compa=Company A,compb=Company B
      # org:person:role:teams (teams joined with +, made as needed).
      QUICKSTART_ACCOUNTS: compa:compa.admin:admin,compa:compa.user:member,compb:compb.admin:admin,compb:compb.user:member
      QUICKSTART_PASSWORD: ${TESTDATA_PASSWORD:-testdata}
    ports:
      - "127.0.0.1:19999:9999"
    volumes:
      - ../../deploy/compose/quickstart/start.py:/quickstart/start.py:ro,z
      - server-logs:/app/logs
    # Stated here as well as in the image: Podman ignores a HEALTHCHECK in an OCI image.
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9999/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 20

  auth:
    image: localhost/ai-control-mesh-dev-server
    build:
      context: ../..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    entrypoint: [agent-auth]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *auth
      AI_PROXY_AUTH_HOST: 0.0.0.0
      AI_PROXY_AUTH_PORT: "10000"
      AI_PROXY_AUTH_DATABASE_URL: postgresql+psycopg://mesh_auth:quickstartauth@postgres:5432/mesh
    ports:
      - "127.0.0.1:20000:10000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20

  machine-1:
    <<: *machine
    hostname: machine-1
    environment:
      <<: *machine-env
      QUICKSTART_OLLAMA: "1"
    depends_on:
      server:
        condition: service_healthy
      auth:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - ../../deploy/compose/quickstart/start.py:/quickstart/start.py:ro,z
      - ../../deploy/compose/quickstart/machine.py:/quickstart/machine.py:ro,z
      - machine-1-home:/home/agent
      - machine-1-workspace:/workspace

  machine-2:
    <<: *machine
    hostname: machine-2
    volumes:
      - ../../deploy/compose/quickstart/start.py:/quickstart/start.py:ro,z
      - ../../deploy/compose/quickstart/machine.py:/quickstart/machine.py:ro,z
      - machine-2-home:/home/agent
      - machine-2-workspace:/workspace

  # Only machine-1 reaches Ollama: start.py relays its loopback port 11434 here, where
  # agent-machine discovers it. Its own network namespace lets Compose recreate either.
  ollama:
    image: docker.io/ollama/ollama:0.40.14
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  server-logs:
  machine-1-home:
  machine-1-workspace:
  machine-2-home:
  machine-2-workspace:
  ollama-models:
