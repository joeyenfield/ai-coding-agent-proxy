# The quickstart: podman compose up -d (or docker compose), from deploy/compose/quickstart. See README.md.
#
# It runs images built and published locally (docs/releases.md):
# AI_PROXY_IMAGE_TAG picks the version (default latest, the last promoted build; 2.1.54 for a
# release). To run this checkout's code instead, use devhelpers/basic, the same stack built from source.
#
# This file is all it needs: its helpers (start.py and machine.py beside it, and PostgreSQL's
# first-start script) are in the images, at /quickstart. So it also runs without a checkout:
#   curl -fsSLO https://raw.githubusercontent.com/joeyenfield/ai-control-mesh/master/deploy/compose/quickstart/compose.yaml
#   docker compose up -d
# The images must be newer than 2.1.57 (an older AI_PROXY_IMAGE_TAG has no /quickstart in them).
name: ai-control-mesh-quickstart

x-auth: &auth
  AI_PROXY_OIDC_ISSUER: http://localhost:20000
  AI_PROXY_OIDC_AUDIENCE: http://localhost:19999
  AI_PROXY_OIDC_REDIRECT_URIS: http://localhost:19999/api/auth/callback
  AI_PROXY_OIDC_BROWSER_ORIGINS: http://localhost:19999
  AI_PROXY_OIDC_INTROSPECTION_SECRET: quickstart-local-introspection-secret
  AI_PROXY_USERNAME: admin
  AI_PROXY_PASSWORD: ${QUICKSTART_ADMIN_PASSWORD:-secret}

x-machine: &machine
  image: ${AI_PROXY_IMAGES:-ghcr.io/joeyenfield}/agent-sandbox:${AI_PROXY_IMAGE_TAG:-latest}
  restart: unless-stopped
  entrypoint: [tini, --, python3, /quickstart/start.py, machine]
  # Stated here as well as in the image: Podman ignores a HEALTHCHECK in an OCI image.
  healthcheck:
    test: [CMD-SHELL, 'agent-machine | grep -q "^Fleet *: connected"']
    interval: 30s
    timeout: 5s
    start_period: 30s
  environment: &machine-env
    QUICKSTART_PASSWORD: ${QUICKSTART_ADMIN_PASSWORD:-secret}
    AI_PROXY_URL: http://localhost:19999
    PYTHONDONTWRITEBYTECODE: "1"
  depends_on:
    server:
      condition: service_healthy
    auth:
      condition: service_healthy

services:
  # PostgreSQL's first-start script (server/docker/postgres-init.sh: a role and a schema each for
  # the server and agent-auth) is in the server's image. This copies it to where PostgreSQL looks,
  # so the stack needs no file beside this one.
  postgres-init:
    image: ${AI_PROXY_IMAGES:-ghcr.io/joeyenfield}/agent-server:${AI_PROXY_IMAGE_TAG:-latest}
    restart: "no"
    user: "0"
    entrypoint: [sh, -c, "cp /quickstart/postgres-init.sh /initdb/10-mesh.sh && chmod 644 /initdb/10-mesh.sh"]
    volumes:
      - postgres-initdb:/initdb

  # Everything the server and agent-auth keep, each in its own schema and role.
  postgres:
    image: docker.io/library/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: mesh
      POSTGRES_PASSWORD: quickstart-postgres
      AI_PROXY_DB_API_PASSWORD: quickstartapi
      AI_PROXY_DB_AUTH_PASSWORD: quickstartauth
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -d, mesh]
      interval: 5s
      timeout: 4s
      retries: 20

  server:
    image: ${AI_PROXY_IMAGES:-ghcr.io/joeyenfield}/agent-server:${AI_PROXY_IMAGE_TAG:-latest}
    restart: unless-stopped
    entrypoint: [python, /quickstart/start.py, server]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *auth
      AI_PROXY_URL: http://localhost:19999
      # Local providers are adopted from the fleet: machine-1's Ollama.
      AI_PROXY_DEFAULT_BACKEND: machine-1
      AI_PROXY_DATABASE_URL: postgresql+psycopg://mesh_api:quickstartapi@postgres:5432/mesh
      # Optional operator key; otherwise start.py provisions one in the persistent server-logs volume.
      AI_PROXY_VAULT_KEYS: ${AI_PROXY_VAULT_KEYS:-}
    ports:
      - "127.0.0.1:19999:9999"
    volumes:
      - server-logs:/app/logs
    # Stated here as well as in the image: Podman ignores a HEALTHCHECK in an OCI image.
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9999/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 20

  auth:
    image: ${AI_PROXY_IMAGES:-ghcr.io/joeyenfield}/agent-server:${AI_PROXY_IMAGE_TAG:-latest}
    restart: unless-stopped
    entrypoint: [agent-auth]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *auth
      AI_PROXY_AUTH_HOST: 0.0.0.0
      AI_PROXY_AUTH_PORT: "10000"
      AI_PROXY_AUTH_DATABASE_URL: postgresql+psycopg://mesh_auth:quickstartauth@postgres:5432/mesh
    ports:
      - "127.0.0.1:20000:10000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20

  machine-1:
    <<: *machine
    hostname: machine-1
    environment:
      <<: *machine-env
      QUICKSTART_OLLAMA: "1"
    depends_on:
      server:
        condition: service_healthy
      auth:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - machine-1-home:/home/agent
      - machine-1-workspace:/workspace

  machine-2:
    <<: *machine
    hostname: machine-2
    volumes:
      - machine-2-home:/home/agent
      - machine-2-workspace:/workspace

  # Only machine-1 reaches Ollama: start.py relays its loopback port 11434 here, where
  # agent-machine discovers it. Its own network namespace lets Compose recreate either.
  ollama:
    image: docker.io/ollama/ollama:0.40.14
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  postgres-initdb:
  server-logs:
  machine-1-home:
  machine-1-workspace:
  machine-2-home:
  machine-2-workspace:
  ollama-models:
