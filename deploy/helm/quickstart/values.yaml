# The Kubernetes quickstart (docs/quickstart-kubernetes.md): the Helm chart on a local cluster.
# One pod with every role, SQLite on a volume, agent-auth in the same pod, no ingress. You reach
# it with kubectl port-forward on http://localhost:19999 (the API and console) and :20000 (sign-in),
# the same addresses as the Compose quickstart.
#   helm install mesh deploy/helm/agent-mesh -n mesh --create-namespace -f deploy/helm/quickstart/values.yaml
mode: single

# Plain HTTP: the issuer accepts it on localhost only, which is all a port-forward needs.
publicScheme: http

# The newest build of master, like the Compose quickstart; pulled again on every pod start.
image:
  tag: latest
  pullPolicy: Always

server:
  host: localhost
  publicUrl: http://localhost:19999
  # The same port inside the pod as on your computer, so the public address works in both.
  port: 19999

auth:
  host: localhost
  issuer:
    # agent-auth listens beside the server in its pod, which reaches it as localhost:20000.
    port: 20000
  oidc:
    issuer: http://localhost:20000

persistence:
  enabled: true
  size: 5Gi

single:
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 2Gi}
