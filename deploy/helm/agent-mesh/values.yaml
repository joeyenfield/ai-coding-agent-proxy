# agent-mesh: agent-server, agent-auth (its OIDC issuer) and optionally the standalone
# console on Kubernetes. See README.md in this folder, and values-single.yaml,
# values-scaled.yaml, values-cloud.yaml and values-onprem.yaml for worked examples.
#
# Nothing secret goes in this file: database URLs, Redis URLs, object-storage keys, the vault
# keys, the OIDC introspection secret and the pod-to-pod token come from Kubernetes Secrets
# (existingSecret names below), from External Secrets (secrets.externalSecrets), or are
# generated by the chart and kept across upgrades.

# single: one Deployment (replicas 1, strategy Recreate) running every role
#         (AI_PROXY_ROLES=all). SQLite on a PersistentVolumeClaim, or PostgreSQL. Redis optional.
# scaled: one Deployment per entry under `roles`, each with its own Service, HPA and PDB.
#         Needs PostgreSQL (external or CloudNativePG) and Redis (external or bundled).
mode: single

nameOverride: ""
fullnameOverride: ""

# The agent-server image runs both agent-server (its entrypoint) and agent-auth (command).
image:
  repository: ghcr.io/joeyenfield/agent-server
  # Empty: the chart's appVersion (the repository's VERSION). Release tags are X.Y.Z;
  # master builds are sha-<commit>.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Scheme of the public addresses below (server.host, auth.host, console.host). Keep https:
# the browser cookies are host-only and the issuer requires HTTPS except on loopback.
publicScheme: https

serviceAccount:
  create: true
  name: ""
  # Annotations for the server's ServiceAccount. objectStorage.serviceAccountAnnotations
  # (IRSA, GKE Workload Identity, Azure Workload Identity) are merged in.
  annotations: {}
  automountServiceAccountToken: false

server:
  # The API's public host name: agents, agent-machine and the console reach the server here.
  # It also sets AI_PROXY_URL / AI_PROXY_PUBLIC_URL (https://<host>), the OIDC audience and
  # callback by default.
  host: api.example.com
  # Overrides https://<host> as the public URL (a path prefix or a port, say).
  publicUrl: ""
  # The main port (AI_PROXY_PORT): API, agents' traffic, WebSockets, /health and /ready.
  port: 9999
  # The pod-to-pod port (AI_PROXY_INTERNAL_PORT): fleet asks, tunnel relays, terminal input,
  # and unauthenticated /metrics for Prometheus. Never routed by the ingress; the
  # NetworkPolicy lets only this release's server pods (and Prometheus) reach it.
  internalPort: 9100
  # uvicorn trusts forwarded headers only from these proxy addresses or CIDRs.
  # Set this to your ingress/gateway ranges. Use "*" only with networkPolicy.publicFrom
  # restricted to trusted proxies; the default publicFrom permits direct pod access.
  forwardedAllowIps: "127.0.0.1"
  # AI_PROXY_DEFAULT_BACKEND, if set.
  defaultBackend: ""
  # Sleep before SIGTERM, so endpoints are removed before the server starts draining.
  preStopSleepSeconds: 5
  # Size limit of the emptyDir scratch folders (/tmp, and /app/logs without persistence).
  scratchSizeLimit: 1Gi
  probes:
    # The startup probe allows 5s x this (10 minutes) before liveness starts. With
    # AI_PROXY_MIGRATE=0 a pod waits up to 10 minutes for the migration Job's schema before
    # it listens at all, so neither /health nor /ready answers until then.
    startupFailureThreshold: 120
  # Extra environment for every agent-server container (list of EnvVar).
  extraEnv: []
  # envFrom for every agent-server container (list of EnvFromSource).
  envFrom: []

# mode: single
single:
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 2Gi}
  # AI_PROXY_WORKERS. More than 1 needs Redis, and puts each worker on an ephemeral internal
  # port (so /metrics isn't on 9100; see roles below).
  workers: 1
  # Every role runs here, the gateway's long streams included.
  terminationGracePeriodSeconds: 300
  podAnnotations: {}
  podLabels: {}

# mode: single only. Holds the SQLite database (logs/agent-server.sqlite3), the server's own
# log, certs/first-user-password and agent-auth's state. Used with SQLite and PostgreSQL alike;
# without it they're in emptyDirs and lost when the pod goes.
persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes: [ReadWriteOnce]
  size: 10Gi
  annotations: {}

# mode: scaled. One Deployment per enabled entry; AI_PROXY_ROLES is its `serves` list, or
# else its own name (the gateway also runs mcp unless roles.mcp is enabled). Every role must
# be served by exactly one entry. Entry names are free: a "middle size" install can disable
# these and define two groups, for example
#   roles:
#     api: {enabled: false}  ...  (every built-in one disabled)
#     control: {enabled: true, serves: [api, realtime, worker], replicas: 2}
#     edge:    {enabled: true, serves: [gateway, mcp, intercept, fleet], replicas: 3, terminationGracePeriodSeconds: 300}
#
# Per entry:
#   enabled, serves            which roles this Deployment runs
#   replicas                   used when autoscaling is off (and as the HPA's minimum if min is unset)
#   workers                    AI_PROXY_WORKERS (uvicorn workers per pod; Redis is always on in scaled mode)
#                              With more than 1, each worker takes an ephemeral internal port: /metrics
#                              isn't on internalPort (9100) and the NetworkPolicy opens all TCP ports
#                              between this release's server pods.
#   terminationGracePeriodSeconds  pods drain on SIGTERM (closing sockets with retryable codes)
#   resources, podAnnotations, podLabels
#   autoscaling: enabled, min, max, metric, target, behavior
#     metric: cpu | memory          Resource metric, target = average utilization in percent
#             open_streams | fleet_sockets | <any name>
#                                    a Pods metric served by the Prometheus adapter
#                                    (custom.metrics.k8s.io), target = average value per pod.
#                                    The metric name is autoscaling.metricNames[metric], else
#                                    agent_server_<metric>. See README.md, "Autoscaling".
#   pdb: maxUnavailable              PodDisruptionBudget (rendered when replicas or min > 1)
roles:
  api:
    enabled: true
    replicas: 2
    workers: 1
    terminationGracePeriodSeconds: 30
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {memory: 1Gi}
    autoscaling: {enabled: true, min: 2, max: 6, metric: cpu, target: 70}
    pdb: {maxUnavailable: 1}
  gateway:
    enabled: true
    replicas: 3
    # 2-4 is reasonable once measured; the gateway keeps nothing in process memory.
    workers: 1
    terminationGracePeriodSeconds: 300
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {memory: 2Gi}
    # With the Prometheus adapter: {metric: open_streams, target: 500}
    autoscaling: {enabled: true, min: 3, max: 20, metric: cpu, target: 70}
    pdb: {maxUnavailable: 1}
  intercept:
    enabled: true
    replicas: 3
    workers: 1
    terminationGracePeriodSeconds: 300
    resources:
      requests: {cpu: "1", memory: 1Gi}
      limits: {memory: 2Gi}
    autoscaling: {enabled: true, min: 3, max: 30, metric: cpu, target: 70}
    pdb: {maxUnavailable: 1}
  # Off by default: the gateway runs the MCP relay. On, /session/<id>/mcp/... is routed here
  # with a regular-expression match, which Gateway API implementations and ingress-nginx
  # (use-regex) support differently; see README.md.
  mcp:
    enabled: false
    replicas: 2
    workers: 1
    terminationGracePeriodSeconds: 300
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {memory: 1Gi}
    autoscaling: {enabled: true, min: 2, max: 10, metric: cpu, target: 70}
    pdb: {maxUnavailable: 1}
  fleet:
    enabled: true
    replicas: 3
    # Keep 1: a machine's socket belongs to one process (the owner registry names the pod).
    workers: 1
    terminationGracePeriodSeconds: 120
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {memory: 1Gi}
    # With the Prometheus adapter: {metric: fleet_sockets, target: 1000}
    autoscaling: {enabled: true, min: 3, max: 8, metric: cpu, target: 70}
    pdb: {maxUnavailable: 1}
  realtime:
    enabled: true
    replicas: 2
    workers: 1
    terminationGracePeriodSeconds: 120
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {memory: 1Gi}
    autoscaling: {enabled: true, min: 2, max: 6, metric: cpu, target: 70}
    pdb: {maxUnavailable: 1}
  # Retention, rollups, first-user bootstrap: one active by Lease, the other on standby.
  worker:
    enabled: true
    replicas: 2
    workers: 1
    terminationGracePeriodSeconds: 30
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {memory: 1Gi}
    autoscaling: {enabled: false}
    pdb: {maxUnavailable: 1}

autoscaling:
  # The Prometheus adapter's metric name for each `metric` value (else agent_server_<metric>).
  metricNames:
    open_streams: agent_server_open_streams
    fleet_sockets: agent_server_fleet_sockets

# Spread every server role (and agent-auth, the console) over zones, then nodes.
topologySpread:
  constraints:
    - {maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway}
    - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile: {type: RuntimeDefault}

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities: {drop: [ALL]}
  # The server writes only under /app/logs, /app/certs, /app/auth-state and /tmp (all
  # mounted); turn this on once you've checked your version does too.
  readOnlyRootFilesystem: false

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

# The builds the console's Downloads page and `agent update` hand out (dist/<version>/ from
# devhelpers/scripts/build-dist.sh), mounted read-only at /app/dist. Several pods need ReadOnlyMany or
# ReadWriteMany. Empty: no downloads.
downloads:
  existingClaim: ""

# ---------------------------------------------------------------- PostgreSQL
# Neither block set: SQLite on the persistence volume (mode single only).
postgresql:
  # A database you run (RDS, Cloud SQL, Azure Flexible Server, your own). Create the roles
  # and schemas first, as server/docker/postgres-init.sh does (docs/deployment.md).
  external:
    # A Secret with the URLs (postgresql+psycopg://mesh_api:<password>@host:5432/mesh?sslmode=require).
    existingSecret: ""
    # agent-server's URL (role mesh_api); through your pooler if you have one.
    urlKey: url
    # agent-auth's URL (role mesh_auth).
    authUrlKey: auth-url
    # Optional: a direct (not pooled) URL for the migration Job, whose advisory lock needs a
    # session. Empty: urlKey.
    migrationUrlKey: ""
  # The CloudNativePG operator's Cluster (on-prem). The operator must be installed already.
  # The chart makes database mesh, roles mesh_api (owner) and mesh_auth, schemas mesh and
  # mesh_auth, mirroring server/docker/postgres-init.sh, with generated passwords kept in
  # Secrets across upgrades.
  cloudnativepg:
    enabled: false
    instances: 3
    # Empty: the operator's default PostgreSQL image. Use 17, as deploy/compose/server/compose.yaml does.
    imageName: ghcr.io/cloudnative-pg/postgresql:17
    storage:
      size: 20Gi
      storageClass: ""
    walStorage:
      enabled: false
      size: 10Gi
      storageClass: ""
    # postgresql.parameters for the Cluster.
    parameters:
      max_connections: "400"
    resources: {}
    # Secrets (type kubernetes.io/basic-auth, keys username and password) to use instead of
    # generated ones: username mesh_api / mesh_auth.
    existingApiSecret: ""
    existingAuthSecret: ""
    # CloudNativePG always serves TLS.
    sslmode: require
    # Spread instances over zones.
    affinity:
      enablePodAntiAffinity: true
      topologyKey: topology.kubernetes.io/zone
    # The Cluster's spec.backup, as is (barmanObjectStore, retentionPolicy, ...). Set it.
    backup: {}
    # Extra spec fields merged into the Cluster.
    extraSpec: {}

# PgBouncer in front of the CloudNativePG cluster (a CNPG Pooler, rw). Only with
# postgresql.cloudnativepg; for an external database put your pooler in its URL.
pgbouncer:
  enabled: true
  instances: 2
  # transaction: what the proposal assumes. Session-level advisory locks don't survive it,
  # so the migration Job, the roles in directRoles and (unless `issuer`) agent-auth
  # connect to the cluster directly.
  poolMode: transaction
  parameters:
    max_client_conn: "2000"
    default_pool_size: "25"
    # psycopg 3 prepares statements; PgBouncer >= 1.21 tracks them in transaction mode.
    max_prepared_statements: "200"
  # Roles that connect directly, not through PgBouncer (leader election, locks).
  directRoles: [worker]
  # agent-auth through PgBouncer too (it migrates its schema under a lock at start).
  issuer: false
  # mode single always connects directly (it holds a lease for its lifetime).

# ---------------------------------------------------------------- Redis / Valkey
# Required in mode scaled; optional in mode single (then needed for workers > 1).
redis:
  # ElastiCache, Memorystore, Azure Cache, your own: a Secret with the URL
  # (redis://:<password>@host:6379/0 or rediss://...).
  external:
    existingSecret: ""
    urlKey: url
  # One Valkey (BSD-licensed, Redis-compatible) StatefulSet with AOF persistence. It's a
  # single instance, not Sentinel: AI_PROXY_REDIS_URL is a plain redis:// URL, and a restart
  # of it costs a few seconds of presence and pub/sub (machines and terminals reconnect).
  # For high availability use a managed Redis or an operator's and redis.external.
  bundled:
    enabled: false
    image: docker.io/valkey/valkey:8.0-alpine
    # A Secret with key "password"; empty: generated and kept across upgrades.
    existingSecret: ""
    # Holds terminal output streams (~4 MiB per open terminal) and presence.
    maxmemory: 1gb
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 1536Mi}
    persistence:
      enabled: true
      storageClass: ""
      size: 8Gi

# ---------------------------------------------------------------- traces and terminal output
objectStorage:
  # AI_PROXY_BLOB_URL: empty or "database" (in PostgreSQL/SQLite, as today),
  # file:///app/logs/blobs (mode single, on the persistence volume), or s3://bucket/prefix.
  url: ""
  # AI_PROXY_BLOB_ENDPOINT, for S3-compatible stores (MinIO, Ceph RGW, SeaweedFS, ...).
  endpoint: ""
  # AI_PROXY_BLOB_REGION.
  region: ""
  # A Secret with an access key; or leave empty and use web identity (annotations below).
  existingSecret: ""
  accessKeyIdKey: AWS_ACCESS_KEY_ID
  secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
  # Merged into the ServiceAccount: IRSA (eks.amazonaws.com/role-arn), GKE Workload Identity
  # (iam.gke.io/gcp-service-account), Azure (azure.workload.identity/client-id).
  serviceAccountAnnotations: {}

# ---------------------------------------------------------------- sign-in
auth:
  # The issuer's public host name (agent-auth). Required with auth.issuer.enabled.
  host: auth.example.com
  issuer:
    # false: use an agent-auth you run elsewhere (set auth.oidc.issuer).
    enabled: true
    # mode scaled; in mode single it's 1 (and runs in the server's pod with SQLite).
    replicas: 2
    port: 10000
    # AI_PROXY_AUTH_JWT_ACCESS_TOKENS: auto (on in mode scaled), true or false.
    jwtAccessTokens: auto
    forwardedAllowIps: "*"
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 512Mi}
    autoscaling: {enabled: false, min: 2, max: 4, target: 70}
    pdb: {maxUnavailable: 1}
    terminationGracePeriodSeconds: 30
    podAnnotations: {}
    extraEnv: []
  # docs/oidc.md's settings. Empty values default from the hosts above.
  oidc:
    # AI_PROXY_OIDC_ISSUER: default https://<auth.host>.
    issuer: ""
    # AI_PROXY_OIDC_AUDIENCE: default https://<server.host>.
    audience: ""
    # AI_PROXY_OIDC_REDIRECT_URIS: default [https://<server.host>/api/auth/callback].
    redirectUris: []
    # AI_PROXY_OIDC_BROWSER_ORIGINS: default the console's origin, else the server's.
    browserOrigins: []
    consoleClient: ""
    cliClient: ""
    introspectionClient: ""
  # An admin outside the users table (AI_PROXY_USERNAME / AI_PROXY_PASSWORD) from a Secret.
  # It stops the first-start bootstrap of `admin` (whose password is otherwise printed in
  # the logs and saved as certs/first-user-password).
  bootstrapAdmin:
    existingSecret: ""
    usernameKey: username
    passwordKey: password

# ---------------------------------------------------------------- the standalone console
# ui/Dockerfile's nginx image. It isn't published: build it with
# --build-arg VITE_API_URL=https://<server.host> and push it to your registry. When enabled,
# the server stops serving the console (AI_PROXY_SERVE_UI=0) and allows its origin
# (AI_PROXY_CONSOLE_ORIGINS). Disabled: the server serves the console on server.host.
console:
  enabled: false
  host: console.example.com
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 2
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
  pdb: {maxUnavailable: 1}
  podAnnotations: {}

# ---------------------------------------------------------------- routing
# §5's path table: in mode scaled each path goes to its role's Service; in mode single
# everything on server.host goes to the one Service. auth.host goes to agent-auth and
# console.host to the console.
routing:
  # Gateway API HTTPRoutes (preferred). Needs a Gateway with listeners for the hosts.
  gatewayAPI:
    enabled: false
    gatewayRef:
      name: ""
      namespace: ""
      sectionName: ""
    # rules[].timeouts for the long-lived paths (model streams, WebSockets, SSE).
    # "0s" disables the timeout. {} leaves it to the implementation (Envoy Gateway:
    # BackendTrafficPolicy / ClientTrafficPolicy).
    streamingTimeouts:
      request: "0s"
    annotations: {}
  # Ingress fallback. The annotations below suit ingress-nginx; other controllers need their
  # own equivalents for long WebSockets and unbuffered streams (see README.md).
  ingress:
    enabled: false
    className: ""
    annotations: {}
    # Added to the Ingress of the long-lived paths (all of server.host in mode single).
    streamingAnnotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    # Added to the API's Ingress (and auth's, console's).
    apiAnnotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    # One TLS block per host; secretName empty: no tls section for that host.
    tls:
      serverSecretName: ""
      authSecretName: ""
      consoleSecretName: ""

# ---------------------------------------------------------------- secrets
secrets:
  # A Secret you manage with the keys below. Empty: the chart creates "<fullname>-app",
  # generating the internal token and introspection secret once and keeping them.
  existingSecret: ""
  keys:
    internalToken: internal-token
    introspectionSecret: oidc-introspection-secret
    vaultKeys: vault-keys
  # Only for the chart-created Secret. Prefer existingSecret or External Secrets.
  # vaultKeys: AI_PROXY_VAULT_KEYS (`agent-server vault key` makes one); empty refuses
  # storing subscriptions' managed tokens.
  vaultKeys: ""
  introspectionSecret: ""
  # External Secrets Operator: the app Secret becomes an ExternalSecret, plus any extra ones
  # (for the database, Redis and object-storage Secrets named in existingSecret above).
  externalSecrets:
    enabled: false
    apiVersion: external-secrets.io/v1
    refreshInterval: 1h
    store:
      name: ""
      kind: ClusterSecretStore
    # The app Secret's keys: secretKey -> remoteRef.
    app:
      internal-token: {key: "", property: ""}
      oidc-introspection-secret: {key: "", property: ""}
      vault-keys: {key: "", property: ""}
    # Extra ExternalSecrets: [{name, data: [{secretKey, remoteRef: {key, property}}]}].
    extra: []

# ---------------------------------------------------------------- migrations
migrations:
  # A Job runs `agent-server db migrate` (pods run with AI_PROXY_MIGRATE=0 and wait for the
  # schema). On upgrades it's a pre-upgrade hook. On install it's a pre-install hook when
  # everything it needs already exists (an external database, no External Secrets), else
  # a plain Job that retries until the database answers (CloudNativePG, External Secrets).
  # auto | hook | job. With SQLite the server migrates itself (AI_PROXY_MIGRATE=1).
  onInstall: auto
  attempts: 60
  activeDeadlineSeconds: 1800
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}

# Seeds the server's retention policy on the first install only, passed to the migration Job as
# AI_PROXY_RETENTION_SEED (JSON), in the shape of the console's server policy (docs/retention.md):
# capture, allowed_traces, and days, max and min for traces, terminal, records, sessions and audit.
# Later changes are made in the console.
#   retention:
#     days: {traces: 30, terminal: 30, sessions: 400, audit: 365}
retention: {}

# ---------------------------------------------------------------- monitoring
monitoring:
  # A ServiceMonitor scraping /metrics on every server pod's internal port.
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
  # Alerts: server pods down or not ready, restarting, and the audit backlog.
  prometheusRule:
    enabled: false
    labels: {}
    auditBacklogThreshold: 10000

# ---------------------------------------------------------------- network policy
networkPolicy:
  enabled: true
  # Where Prometheus runs: allowed to the internal port (for /metrics).
  prometheusNamespace: monitoring
  # Extra peers allowed to the public ports (server, agent-auth, console). Empty: anyone,
  # since the ingress controller's pods differ per cluster. Example:
  #   - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
  publicFrom: []
