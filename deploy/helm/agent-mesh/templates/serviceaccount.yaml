{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agent-mesh.serviceAccountName" . }}
  labels:
    {{- include "agent-mesh.labels" (dict "root" . "component" "server") | nindent 4 }}
  {{- $ann := merge (dict) (.Values.serviceAccount.annotations | default dict) (.Values.objectStorage.serviceAccountAnnotations | default dict) }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
