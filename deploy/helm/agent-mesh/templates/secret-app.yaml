{{- /*
The release's own secrets: the pod-to-pod token (AI_PROXY_INTERNAL_TOKEN), the OIDC
introspection secret both agent-server and agent-auth use, and the vault keys. Generated
values are kept across upgrades (lookup). Replaced by an ExternalSecret when
secrets.externalSecrets is enabled, and not rendered with secrets.existingSecret.
*/ -}}
{{- if not .Values.secrets.existingSecret }}
{{- $name := include "agent-mesh.appSecretName" . }}
{{- $k := .Values.secrets.keys }}
{{- if .Values.secrets.externalSecrets.enabled }}
{{- $es := .Values.secrets.externalSecrets }}
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "agent-mesh.labels" (dict "root" . "component" "server") | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ required "secrets.externalSecrets.store.name is required" $es.store.name }}
    kind: {{ $es.store.kind }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
  data:
    {{- range $secretKey, $ref := $es.app }}
    {{- if $ref.key }}
    - secretKey: {{ $secretKey }}
      remoteRef:
        key: {{ $ref.key }}
        {{- with $ref.property }}
        property: {{ . }}
        {{- end }}
    {{- end }}
    {{- end }}
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "agent-mesh.labels" (dict "root" . "component" "server") | nindent 4 }}
  annotations:
    # Keep it on uninstall: the vault keys decrypt what the database holds.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $k.internalToken }}: {{ include "agent-mesh.keepSecret" (dict "root" . "name" $name "key" $k.internalToken "value" "") | b64enc | quote }}
  {{ $k.introspectionSecret }}: {{ include "agent-mesh.keepSecret" (dict "root" . "name" $name "key" $k.introspectionSecret "value" .Values.secrets.introspectionSecret) | b64enc | quote }}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
  {{- if and $existing $existing.data (hasKey $existing.data $k.vaultKeys) (not .Values.secrets.vaultKeys) }}
  {{ $k.vaultKeys }}: {{ index $existing.data $k.vaultKeys | quote }}
  {{- else if .Values.secrets.vaultKeys }}
  {{ $k.vaultKeys }}: {{ .Values.secrets.vaultKeys | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- if .Values.secrets.externalSecrets.enabled }}
{{- $es := .Values.secrets.externalSecrets }}
{{- range $extra := $es.extra }}
---
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $extra.name }}
  labels:
    {{- include "agent-mesh.labels" (dict "root" $ "component" "server") | nindent 4 }}
spec:
  refreshInterval: {{ $extra.refreshInterval | default $es.refreshInterval }}
  secretStoreRef:
    name: {{ ($extra.store | default dict).name | default $es.store.name }}
    kind: {{ ($extra.store | default dict).kind | default $es.store.kind }}
  target:
    name: {{ $extra.name }}
    creationPolicy: Owner
    {{- with $extra.template }}
    template:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  data:
    {{- toYaml $extra.data | nindent 4 }}
{{- end }}
{{- end }}
