# Makes a GitHub Release for each v* tag, with everything the web installer needs (docs/local.md):
#
#   curl -fsSL https://github.com/<owner>/<repo>/releases/latest/download/install-local.sh | sh
#   irm https://github.com/<owner>/<repo>/releases/latest/download/install-local.ps1 | iex
#
# It builds the console (ui/dist), every platform's agent and agent-machine archives and the
# Python wheel (tools/dist, without packages or the Android app), then scripts/release/release.py
# makes the server bundle and the two installers, with every file's SHA-256 written into them.
#
#   a tag v2.1.49   the release v2.1.49, with those files (replaced if it already has them)
#   by hand         (Actions › Release › Run workflow) the same files as a workflow artifact, no release
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The same as server/agent_server/version.py, tools/dist/version.go and images.yml: X.Y.Z on
      # its tag, else X.Y.Z+<short commit>.
      - id: version
        run: |
          base=$(tr -d '[:space:]' < VERSION)
          if [ "$(git describe --tags --always --abbrev=7)" = "v$base" ]; then
            version=$base
          else
            version="$base+$(git rev-parse --short=7 HEAD)"
          fi
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "The tag ${GITHUB_REF_NAME} isn't VERSION's (v$version): set VERSION, commit, then tag." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"
      - name: Console
        working-directory: ui
        run: npm ci --no-audit --no-fund && npm run build
      - name: agent and agent-machine
        working-directory: tools
        env:
          GOTOOLCHAIN: local
        run: go run ./dist -version "${{ steps.version.outputs.version }}" -android=false
      - name: Release files
        run: |
          python scripts/release/release.py --version "${{ steps.version.outputs.version }}" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${{ steps.version.outputs.version }}"
      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          files=(dist/release/"$version"/*)
          if gh release view "v$version" >/dev/null 2>&1; then
            gh release upload "v$version" "${files[@]}" --clobber
          else
            gh release create "v$version" "${files[@]}" --verify-tag --title "$version" --notes \
              "Run it on your computer: \`curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/v$version/install-local.sh | sh\` (Windows PowerShell: \`irm https://github.com/${GITHUB_REPOSITORY}/releases/download/v$version/install-local.ps1 | iex\`). See docs/local.md."
          fi
      - name: Keep the files
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.run_id }}
          path: dist/release/
