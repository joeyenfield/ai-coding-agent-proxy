# Builds the container images and pushes them to the GitHub Container Registry (ghcr.io):
#
#   ghcr.io/<owner>/agent-server           server/Dockerfile: agent-server and agent-auth (one image, two entrypoints)
#   ghcr.io/<owner>/agent-sandbox          sandbox/Dockerfile: a fleet machine in a container, with the coding agents
#   ghcr.io/<owner>/ai-control-mesh-site   site/Dockerfile: the brochure website
#
# The standalone console (ui/Dockerfile) isn't here: it bakes its API's address in when it's
# built (VITE_API_URL), so each deployment builds its own.
#
# Each image is built for linux/amd64 and linux/arm64 (the Raspberry Pi) on native runners, not
# under emulation, pushed by digest, then joined into one multi-platform tag.
#
#   a tag v2.0.1     2.0.1, 2.0 and latest
#   master           master and sha-<commit>
#   by hand          (Actions › Images › Run workflow) the same as a push of that branch or tag
name: Images

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      owner: ${{ steps.version.outputs.owner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The same as server/agent_server/version.py and tools/dist/version.go: X.Y.Z on its tag,
      # else X.Y.Z+<short commit>. The images have no git, so it's passed in as AI_PROXY_VERSION.
      - id: version
        run: |
          base=$(tr -d '[:space:]' < VERSION)
          if [ "$(git describe --tags --always --abbrev=7)" = "v$base" ]; then
            version=$base
          else
            version="$base+$(git rev-parse --short=7 HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Registry names must be lower case.
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "Building $version"

  build:
    name: ${{ matrix.image.name }} (${{ matrix.platform }})
    needs: version
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: agent-server, dockerfile: server/Dockerfile }
          - { name: agent-sandbox, dockerfile: sandbox/Dockerfile }
          - { name: ai-control-mesh-site, dockerfile: site/Dockerfile }
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.version.outputs.owner }}/${{ matrix.image.name }}
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: AI_PROXY_VERSION=${{ needs.version.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          # Pushed without a tag: the merge job below tags both platforms' digests together.
          # Docker's manifest format, not OCI's: Podman reads an image's HEALTHCHECK only from
          # Docker's, and the quickstart's machines wait for the server to be healthy. The
          # provenance attestation would need OCI's, so it's left out.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ needs.version.outputs.owner }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=false
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform }}
      - name: Keep the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: ${{ matrix.image }}
    needs: [version, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [agent-server, agent-sandbox, ai-control-mesh-site]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.version.outputs.owner }}/${{ matrix.image }}
          # latest only for release tags, not for every push to master.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
      - name: Tag both platforms together
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ needs.version.outputs.owner }}/${{ matrix.image }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Show it
        run: docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ needs.version.outputs.owner }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}"
