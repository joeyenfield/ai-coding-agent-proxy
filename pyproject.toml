[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent-framework"
version = "0.1.0"
description = "A streaming Ollama proxy, benchmark runner, and coding-agent launcher"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
local-agent-proxy = "local_agent.proxy.app:main"
local-agent-benchmark = "local_agent.benchmark:main"
local-agent = "local_agent.launcher:main"
agent = "local_agent.launcher:main"

[tool.setuptools.packages.find]
include = ["local_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
