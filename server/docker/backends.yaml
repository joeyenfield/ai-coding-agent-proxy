# agent-server's backends inside its Docker container. Copied into the config volume
# on the first start; edit it there, or from the console's Settings page.
#
# 127.0.0.1 is the container itself, so providers on the Docker host are reached as
# host.docker.internal (compose.yaml maps it on Linux too). Use a LAN address or DNS
# name for providers on other machines.
proxy:
  listen_host: 0.0.0.0
  listen_port: 9999
  # How agent machines reach this server; `agent login` suggests it. Set it to this
  # host's address, e.g. http://agents.example.lan:9999.
  url: http://127.0.0.1:9999
default_backend: ollama
backends:
  ollama:
    type: ollama
    url: http://host.docker.internal:11434
  anthropic:
    type: anthropic
    url: https://api.anthropic.com
intercept:
  enabled: true
  passthrough: []
