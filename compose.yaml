# agent-server in Docker: docker compose up -d
#
# The console is then on http://<this host>:9999. On first start the server creates an
# admin with a random password: `docker compose logs agent-server` shows it, and it's
# saved as certs/first-user-password in the agent-server-certs volume. Sign each agent
# machine in through OIDC: agent login https://api.aicontrolmesh.com
#
# Everything the server keeps (settings, accounts, the fleet, every session's records,
# traces and terminals, and agent-auth's OAuth state) is in PostgreSQL, in the postgres-data
# volume; back it up with: docker compose exec -T postgres pg_dump -U postgres -Fc mesh > mesh.dump
# Set AI_PROXY_POSTGRES_PASSWORD, AI_PROXY_DB_API_PASSWORD and AI_PROXY_DB_AUTH_PASSWORD
# (letters and digits) in .env before the first start.
#
# The images come from the GitHub Container Registry, built by .github/workflows/images.yml:
# AI_PROXY_IMAGE_TAG picks the version (default latest, the newest release; 2.0.1, or
# sha-<commit> for a commit of master), AI_PROXY_IMAGES another registry or owner. To build
# them from this checkout instead: docker compose -f compose.yaml -f compose.build.yaml up -d --build
services:
  postgres:
    image: docker.io/library/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: mesh
      POSTGRES_PASSWORD: ${AI_PROXY_POSTGRES_PASSWORD:?Set a password for PostgreSQL's administrator}
      # The roles server/docker/postgres-init.sh makes on the first start: agent-server's and agent-auth's.
      AI_PROXY_DB_API_PASSWORD: ${AI_PROXY_DB_API_PASSWORD:?Set a password for agent-server's database role}
      AI_PROXY_DB_AUTH_PASSWORD: ${AI_PROXY_DB_AUTH_PASSWORD:?Set a password for agent-auth's database role}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./server/docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-mesh.sh:ro
    # No published port: only agent-server and agent-auth reach it.
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "mesh"]
      interval: 5s
      timeout: 4s
      retries: 20

  agent-auth:
    image: ${AI_PROXY_IMAGES:-ghcr.io/joeyenfield}/agent-server:${AI_PROXY_IMAGE_TAG:-latest}
    entrypoint: ["agent-auth"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Its OAuth state, in schema mesh_auth; the role reads accounts but can't change them.
      AI_PROXY_AUTH_DATABASE_URL: postgresql+psycopg://mesh_auth:${AI_PROXY_DB_AUTH_PASSWORD}@postgres:5432/mesh
      AI_PROXY_AUTH_HOST: 0.0.0.0
      AI_PROXY_AUTH_PORT: 10000
      AI_PROXY_OIDC_ISSUER: ${AI_PROXY_OIDC_ISSUER:-https://auth.aicontrolmesh.com}
      AI_PROXY_OIDC_AUDIENCE: ${AI_PROXY_OIDC_AUDIENCE:-https://api.aicontrolmesh.com}
      AI_PROXY_OIDC_REDIRECT_URIS: ${AI_PROXY_OIDC_REDIRECT_URIS:-https://api.aicontrolmesh.com/api/auth/callback}
      AI_PROXY_OIDC_BROWSER_ORIGINS: ${AI_PROXY_OIDC_BROWSER_ORIGINS:-https://console.aicontrolmesh.com}
      AI_PROXY_OIDC_INTROSPECTION_SECRET: ${AI_PROXY_OIDC_INTROSPECTION_SECRET:?Set a strong shared OIDC introspection secret}
      AI_PROXY_OIDC_STATE_DIR: /app/auth-state
      # Requests reach the container from Docker's bridge, not 127.0.0.1, so uvicorn would
      # ignore the reverse proxy's X-Forwarded-For: every visitor would share one address,
      # and with it the password rate limit. The port below is loopback-only, so only this
      # computer's own processes (the reverse proxy) can send these headers.
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "127.0.0.1:10000:10000"
    volumes:
      # Read once, by an issuer upgraded from before the database (its issuer.sqlite3 and
      # signing key); a new install doesn't need it.
      - agent-auth-state:/app/auth-state:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10000/health', timeout=3)"]

  # Built here, not pulled: it carries its API's address (VITE_API_URL) from the build.
  console:
    profiles: [console]
    build:
      context: .
      dockerfile: ui/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:9999}
    image: ai-control-mesh-console
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"

  marketing-site:
    image: ${AI_PROXY_IMAGES:-ghcr.io/joeyenfield}/ai-control-mesh-site:${AI_PROXY_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"

  agent-server:
    image: ${AI_PROXY_IMAGES:-ghcr.io/joeyenfield}/agent-server:${AI_PROXY_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AI_PROXY_DATABASE_URL: postgresql+psycopg://mesh_api:${AI_PROXY_DB_API_PASSWORD}@postgres:5432/mesh
      AI_PROXY_SERVE_UI: ${AI_PROXY_SERVE_UI:-1}
      AI_PROXY_CONSOLE_ORIGINS: ${AI_PROXY_CONSOLE_ORIGINS:-}
      AI_PROXY_OIDC_ISSUER: ${AI_PROXY_OIDC_ISSUER:-https://auth.aicontrolmesh.com}
      AI_PROXY_OIDC_AUDIENCE: ${AI_PROXY_OIDC_AUDIENCE:-https://api.aicontrolmesh.com}
      AI_PROXY_OIDC_REDIRECT_URIS: ${AI_PROXY_OIDC_REDIRECT_URIS:-https://api.aicontrolmesh.com/api/auth/callback}
      AI_PROXY_OIDC_BROWSER_ORIGINS: ${AI_PROXY_OIDC_BROWSER_ORIGINS:-https://console.aicontrolmesh.com}
      AI_PROXY_OIDC_INTROSPECTION_SECRET: ${AI_PROXY_OIDC_INTROSPECTION_SECRET:?Set a strong shared OIDC introspection secret}
      # Behind a reverse proxy on this computer (nginx for HTTPS): set AI_PROXY_PUBLISH_HOST=127.0.0.1
      # and AI_PROXY_FORWARDED_ALLOW_IPS=*, so the proxy's X-Forwarded-For and -Proto count (the
      # container sees Docker's bridge, never 127.0.0.1) and nothing else can reach the port to fake them.
      FORWARDED_ALLOW_IPS: ${AI_PROXY_FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      - "${AI_PROXY_PUBLISH_HOST:-0.0.0.0}:9999:9999"
    extra_hosts:
      # Providers on the Docker host (Ollama on 11434, ...), on Linux as on Docker Desktop.
      - "host.docker.internal:host-gateway"
    volumes:
      # The server's own log (logs/proxy/proxy.log), and certs/first-user-password once.
      - agent-server-logs:/app/logs
      - agent-server-certs:/app/certs
      # Only for an install from before the database: its config/ (and the logs/ and certs/
      # above) are imported into PostgreSQL on the first start, then no longer read.
      - agent-server-config:/app/config:ro
      # The builds the console's Downloads page and `agent update` hand out
      # (scripts/build-dist.sh). The server offers the one of its own version, or the
      # newest of the same release: use the image of the same version (AI_PROXY_IMAGE_TAG).
      - ./dist:/app/dist:ro

  # A sandbox machine: coding agents the console starts on it run in this container, in
  # /workspace only. On first start, follow logs and approve both OIDC device codes.
  # Rotating credentials persist in agent-sandbox-home; no password is supplied here.
  agent-sandbox:
    profiles: [sandbox]
    image: ${AI_PROXY_IMAGES:-ghcr.io/joeyenfield}/agent-sandbox:${AI_PROXY_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on: [agent-server]
    hostname: agent-sandbox
    environment:
      AI_PROXY_SERVER: ${AI_PROXY_SERVER:-https://api.aicontrolmesh.com}
      AI_PROXY_MACHINE_NAME: ${AI_PROXY_MACHINE_NAME:-agent-sandbox}
      GIT_USER_NAME: ${GIT_USER_NAME:-}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-}
      AGENT_REPOS: ${AGENT_REPOS:-}
    volumes:
      - agent-sandbox-home:/home/agent
      - agent-sandbox-workspace:/workspace
      # SSH keys for git (copied into ~/.ssh on start). Better a deploy key or one made
      # for the sandbox than your own: agents here can read it.
      # - ./sandbox-ssh:/ssh:ro
      # Or work on a folder of this computer's:
      # - ./projects:/workspace

volumes:
  postgres-data:
  agent-server-config:
  agent-auth-state:
  agent-server-logs:
  agent-server-certs:
  agent-sandbox-home:
  agent-sandbox-workspace:
